# Site
name: "Ganesh"
title: "Ganesh"
url: "https://nagaganesh.com"
description: "Books, movies, and travel."
logo: 'assets/images/site/logo.png'
include: ["_pages"]
permalink: /:title/
email: ganesh.jaladanki@gmail.com

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Book notes: one file per book in _books/, listed on /books and served at /<title>/.
collections:
  books:
    output: true
    permalink: /:title/

defaults:
  - scope:
      type: books
    values:
      layout: book

# Other
markdown: kramdown

# Tooling and docs at the repository root stay out of the built site. Add any new
# root-level config or source folder here.
exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - assets/vendor/README.md
  - scripts/
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - eslint.config.js
  - jsconfig.json
  - tests/
  - types/
  - pyproject.toml

# The minifier's CSS compressor mangles custom properties inside calc()/max(),
# e.g. var(--viewport-height) becomes var( -  - viewport - height), which drops
# whole declarations. Leave CSS unminified; it is served gzipped anyway.
jekyll-minifier:
  compress_css: false
