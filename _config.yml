# Site
name: "Ganesh"
title: "Ganesh"
url: "https://nagaganesh.com"
description: "Reading, movies, and travel."
logo: 'assets/images/logo.png'
include: ["_pages"]
permalink: /:title/
email: ganesh.jaladanki@gmail.com

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

# Other
markdown: kramdown

exclude:
  - AGENTS.md
  - README.md
  - LICENSE.txt
  - scripts/
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - eslint.config.js
  - jsconfig.json
  - tests/
  - types/
  - pyproject.toml
  - requirements.txt

redirect_from:
  json: false

# The minifier's CSS compressor mangles custom properties inside calc()/max(),
# e.g. var(--viewport-height) becomes var( -  - viewport - height), which drops
# whole declarations. Leave CSS unminified; it is served gzipped anyway.
jekyll-minifier:
  compress_css: false
