# Site
name: "Ganesh"
title: "Ganesh"
url: "https://nagaganesh.com"
description: "Reading, movies, and travel."
logo: 'assets/images/logo.png'
include: ["_pages"]
permalink: /:title/
email: ganesh.jaladanki@gmail.com

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

# Other
markdown: kramdown

exclude:
  - AGENTS.md
  - README.md
  - LICENSE.txt
  - scripts/
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - eslint.config.js
  - pyproject.toml
  - requirements.txt

redirect_from:
  json: false
