# Site
name: "Ganesh"
title: "Ganesh"
url: "https://nagaganesh.com"
description: "Reading, movies, and travel."
logo: 'assets/images/logo.png'
favicon: 'assets/images/logo.png'
google_analytics: 'UA-xxxxxxxx-1'
disqus: 'nagaganesh'
include: ["_pages"]
permalink: /:title/
email: ganesh.jaladanki@gmail.com

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-figure
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'

# Other
highlighter: rouge
markdown: kramdown
kramdown:
   syntax_highlighter_opts:
      disable : true


# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: "ca-pub-3412143450191416"
adsense-data-ad-slot: "1363087678"

# Lazy Images ("enabled" or "disabled")
lazyimages: "enabled"

# Post Author Box ("enabled" or "disabled")
authorbox: "disabled"

# Sass
sass:
  sass_dir: _sass
  style: compressed

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock, scripts, tests, _pages/blog.md, _pages/projects.md, _pages/categories.md, _pages/tags.md, feed.xml, assets/js/lunrsearchengine.js, assets/css/theme.scss, _posts/2016-01-01-things.md, _posts/2018-01-16-etherball.md, _posts/2018-02-25-hashpy.md, _posts/2018-05-20-chip8emu.md, _posts/2019-02-15-codequeue-post.md, _posts/2019-03-28-nesmerize.md, _posts/2019-10-16-riscy.md]
