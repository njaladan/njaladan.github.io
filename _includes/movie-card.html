{% assign film = site.data.movies.films | where: 'id', include.film_id | first %}
<article class="library-card" data-film-id="{{ film.id | escape }}" data-title="{{ film.title | escape }}" data-date="{{ include.date }}" data-year="{{ include.year | default: film.year }}" data-section="{{ include.section }}">
  <div class="cover movie-cover">
    <div class="cover-fallback" aria-hidden="true"><span>{{ film.title | escape }}</span></div>
    {% if film.cover %}<img src="{{ film.cover | relative_url }}" alt="" width="300" height="450" loading="lazy" decoding="async">{% endif %}
  </div>
  <span class="card-title" title="{{ film.title | escape }}">{% if film.title.size > 65 %}{{ film.title | truncatewords: 9, "…" | escape }}{% else %}{{ film.title | escape }}{% endif %}</span>
</article>
