<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f3">
  <link rel="icon" href="{{ '/assets/images/logo.png' | relative_url }}">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/library.css' | relative_url }}?v=2">
  {% if page.library %}<script defer src="{{ '/assets/js/library.js' | relative_url }}?v=2"></script>{% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="site-logo" href="{{ '/' | relative_url }}" aria-label="Home"><img src="{{ '/assets/images/logo.png' | relative_url }}" alt="" width="48" height="48"></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>About</a>
        <a href="{{ '/reading' | relative_url }}" {% if page.url == '/reading' or page.tags contains 'Books' %}aria-current="page"{% endif %}>Reading</a>
        <a href="{{ '/movies' | relative_url }}" {% if page.url == '/movies' %}aria-current="page"{% endif %}>Movies</a>
        <a href="{{ '/travel/' | relative_url }}">Travel</a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer">Logo courtesy of <a href="https://www.emersonhsieh.com/">Emerson Hsieh</a>.</footer>
  </div>
</body>
</html>
