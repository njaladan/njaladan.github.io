<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f3">
  <link rel="icon" href="{{ '/assets/images/logo.png' | relative_url }}">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/library.css' | relative_url }}?v=3">
  <link rel="stylesheet" href="{{ '/assets/css/header.css' | relative_url }}?v=1">
  {% if page.photos %}
  <link rel="stylesheet" href="{{ '/travel/gallery/gallery.css' | relative_url }}?v=3">
  <script defer src="{{ '/travel/gallery/gallery.js' | relative_url }}?v=3"></script>
  {% endif %}
  {% if page.library %}<script defer src="{{ '/assets/js/library.js' | relative_url }}?v=2"></script>{% endif %}
</head>
<body>
  {% include site-header.html %}
  <div class="site-shell">
    <main id="main"{% if page.photos %} class="gallery-main"{% endif %}>{{ content }}</main>
    <footer class="site-footer">Logo courtesy of <a href="https://www.emersonhsieh.com/">Emerson Hsieh</a>.</footer>
  </div>
</body>
</html>
