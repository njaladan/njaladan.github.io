<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f3">
  <link rel="icon" href="{{ '/assets/images/logo.png' | relative_url }}">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/library.css' | relative_url }}">
  {% if page.library %}<script defer src="{{ '/assets/js/library.js' | relative_url }}"></script>{% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}">Ganesh.</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>About</a>
        <a href="{{ '/reading' | relative_url }}" {% if page.url == '/reading' or page.tags contains 'Books' %}aria-current="page"{% endif %}>Reading</a>
        <a href="{{ '/movies' | relative_url }}" {% if page.url == '/movies' %}aria-current="page"{% endif %}>Movies</a>
        <a href="{{ '/travel/' | relative_url }}">Travel</a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer"><span>Ganesh · New York City</span><a href="mailto:ganesh.jaladanki@gmail.com">Say hello ↗</a></footer>
  </div>
</body>
</html>
